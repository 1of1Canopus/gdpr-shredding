services:
  postgres:
    image: postgres:16-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
    environment:
      POSTGRES_DB: shredding
      POSTGRES_USER: shredding
      POSTGRES_PASSWORD: shredding
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shredding"]
      interval: 2s
      timeout: 3s
      retries: 20
