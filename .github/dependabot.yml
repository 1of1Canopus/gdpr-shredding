# Dependabot: GitHub-native dependency + vulnerability watch (Advisory Database, no NVD key).
# The scheduled OWASP scan (workflows/security-scan.yml) is the deeper backstop.
version: 2
updates:
  - package-ecosystem: "maven"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
    labels: ["dependencies"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels: ["dependencies", "ci"]
