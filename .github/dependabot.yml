# Dependabot: GitHub-native dependency + vulnerability watch (Advisory Database, no NVD key).
# The scheduled OWASP scan (workflows/security-scan.yml) is the deeper backstop.
version: 2
updates:
  - package-ecosystem: "maven"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
    labels: ["dependencies"]
    ignore:
      # central-publishing-maven-plugin 0.11.0 builds a bundle the Central Portal refuses on Maven
      # 3.10 (maven-metadata-local.xml and _remote.repositories inside it; the v0.2.0 run failed
      # this way). Upstream: jboss/jboss-parent-pom#584, cuioss/cuioss-parent-pom#1501. Drop this
      # once a plugin release supports Maven 3.10.
      - dependency-name: "org.apache.maven:apache-maven"
        versions: [">= 3.10"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    labels: ["dependencies", "ci"]
