name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # F2 (fourteenth pass): CONTRIBUTING.md requires every commit in a pull request to carry a DCO
  # "Signed-off-by:" trailer (git commit -s). This is the only enforcement of that requirement -
  # nothing rejects an unsigned commit at merge time otherwise. Runs only on pull_request, where
  # github.event.pull_request.base.sha / .head.sha give an exact commit range; a plain push to
  # main (already reviewed, already merged) is not re-checked. Copied from
  # B-agent-guard/.github/workflows/ci.yml (its G2/G3/G4 hardening kept verbatim: parent count,
  # not subject text, is what exempts a merge commit, and only a trivial back-merge of the base
  # at that - an octopus merge, an evil merge, or a two-parent commit whose second parent is not
  # from the base all fall through to the sign-off requirement).
  #
  # GRANDFATHER_SHA (B's own precedent, same reasoning): this requirement is adopted mid-flight,
  # on this still-open PR, which already carries commits pushed before CONTRIBUTING.md asked for
  # a sign-off. Those commits cannot gain a trailer without rewriting already-pushed history,
  # which this portfolio's git rules forbid (no force-push, ever). c1b4157 is the last commit
  # made before this job was added; a commit is exempt only if it IS c1b4157 or an ANCESTOR of
  # it. Self-limiting: once this PR merges, c1b4157 becomes part of main's history and every
  # commit on every future branch is a DESCENDANT of it, never an ancestor, so the exemption can
  # never match a new commit again, here or on any later PR.
  dco:
    name: DCO sign-off
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Verify every commit in this pull request is signed off
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GRANDFATHER_SHA: c1b415747088b77a923d14f0a62052bdb673e7a9
        run: |
          set -euo pipefail
          missing=0
          while IFS= read -r sha; do
            [ -n "$sha" ] || continue
            if git cat-file -e "$GRANDFATHER_SHA" 2>/dev/null \
                && git merge-base --is-ancestor "$sha" "$GRANDFATHER_SHA"; then
              continue
            fi
            subject="$(git log -1 --format='%s' "$sha")"
            # a merge commit is exempt because it has two-or-more parents (%P), never because of
            # its subject - a subject is free text the committer chooses and cannot be trusted.
            # Parent count alone is too broad, though: an octopus merge or a two-parent commit
            # whose second parent is not from the base can carry authored content ("evil merge")
            # that exists in no parent, while still being waved through as "a real merge". Exempt
            # a merge only when it is a trivial back-merge of the base: exactly two parents, the
            # second an ancestor of BASE_SHA, and the commit's own tree identical to the tree git
            # itself computes for merging those two parents (git merge-tree, needs git >= 2.38;
            # ubuntu-latest is well past it). An octopus, a two-parent commit whose second parent
            # is not from the base, and any merge carrying an evil-merge delta all fall through to
            # the sign-off requirement.
            parents="$(git log -1 --format='%P' "$sha")"
            set -- $parents
            if [ "$#" -ge 2 ]; then
              exempt=0
              if [ "$#" -eq 2 ] && git merge-base --is-ancestor "$2" "$BASE_SHA" 2>/dev/null; then
                auto=""
                # git merge-tree --write-tree exits non-zero when the merge it computes has a
                # conflict, even though it still writes a tree. Under set -euo pipefail that would
                # kill this step before the sign-off check ever ran; the if guards the
                # substitution so errexit skips it on that path instead: auto stays empty, the
                # exempt check fails, and a conflict-resolution merge (authored content) correctly
                # falls through to the sign-off requirement below, with a visible error.
                if merged="$(git merge-tree --write-tree "$1" "$2" 2>/dev/null)"; then
                  auto="$(printf '%s\n' "$merged" | head -1)"
                fi
                own="$(git rev-parse "$sha^{tree}")"
                [ -n "$auto" ] && [ "$auto" = "$own" ] && exempt=1
              fi
              [ "$exempt" -eq 1 ] && continue
            fi
            if ! git log -1 --format='%B' "$sha" | grep -Eiq '^Signed-off-by: .+ <.+@.+>$'; then
              echo "::error::commit $sha (\"$subject\") has no 'Signed-off-by:' trailer - see CONTRIBUTING.md, git commit -s"
              missing=$((missing + 1))
            fi
          done < <(git rev-list "${BASE_SHA}..${HEAD_SHA}")
          if [ "$missing" -gt 0 ]; then
            echo "::error::$missing commit(s) missing a DCO sign-off"
            exit 1
          fi
          echo "all commits in ${BASE_SHA}..${HEAD_SHA} are signed off"

  build-and-test:
    name: Build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # F1 (fourteenth pass): a public file must never point a reader at a document that was moved
      # out of this repository (QUESTIONS.md, STATUS.md, SPEC.md, the portfolio's LICENSING.md /
      # SHARED-CONVENTIONS.md / AGENTS.md, docs/plans, the internal SECURITY-REVIEW / RELEASING
      # write-ups) or at this machine's own filesystem. `internal/` is excluded because that is
      # where the private working docs this repo's own tooling reads (e.g. the security review
      # feeding cipher-probe-release-pipeline.sh, where it exists) legitimately live outside the
      # public tree; nothing under it ships in a released artifact.
      - name: Refuse a reference to a moved-private document or a machine-local path
        run: |
          set -euo pipefail
          pattern='QUESTIONS\.md|STATUS\.md|SPEC\.md|LICENSING\.md|SHARED-CONVENTIONS\.md|AGENTS\.md|docs/plans|SECURITY-REVIEW|RELEASING|/Users/'
          # This workflow file's own definition of the pattern is exempt - it has to spell out
          # the names it forbids elsewhere.
          if git grep -InE "$pattern" -- ':!internal/**' ':!.github/workflows/ci.yml' > hits.txt; then
            echo "::error::found a reference to a moved-private document or a machine-local path:"
            cat hits.txt
            rm -f hits.txt
            exit 1
          fi
          rm -f hits.txt
          echo "no dangling reference to a moved-private document or a machine path found"
      - name: Set up JDK 21
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      # ubuntu-latest ships Docker: Testcontainers starts PostgreSQL and Redis for the integration tests.
      - name: Build, test, format check, coverage gate, third-party notices
        run: ./mvnw -B clean verify
      - name: Upload third-party notices
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: third-party-notices
          path: "**/target/THIRD-PARTY-NOTICES.txt"

  # F3 (fourteenth pass): the release profile (`pom.xml`'s `release` profile) was never exercised
  # by CI - it runs only `clean verify` and `-Psecurity-scan` - so its javadoc break shipped
  # unnoticed for six passes. Runs the documented dry run on every push and pull request, no GPG
  # key needed (`-Dgpg.skip=true`), so a break in the sources jar, the javadoc jar, or the plugin
  # wiring itself fails CI instead of only a real release attempt.
  release-dryrun:
    name: Release dry run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up JDK 21
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Build sources jar, javadoc jar and a detached signature, no key required
        run: ./mvnw -B -DskipTests -Prelease -Dgpg.skip=true package
