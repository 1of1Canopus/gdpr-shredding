name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up JDK 21
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      # ubuntu-latest ships Docker: Testcontainers starts PostgreSQL and Redis for the integration tests.
      - name: Build, test, format check, coverage gate, third-party notices
        run: ./mvnw -B clean verify
      - name: Upload third-party notices
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: third-party-notices
          path: "**/target/THIRD-PARTY-NOTICES.txt"
      # F1 (fourteenth pass): a public file must never point a reader at a document that was moved
      # out of this repository (QUESTIONS.md, STATUS.md, SPEC.md, the portfolio's LICENSING.md /
      # SHARED-CONVENTIONS.md / AGENTS.md, docs/plans, the internal SECURITY-REVIEW / RELEASING
      # write-ups) or at this machine's own filesystem. `internal/` is excluded because that is
      # where the private working docs this repo's own tooling reads (e.g. the security review
      # feeding cipher-probe-release-pipeline.sh, where it exists) legitimately live outside the
      # public tree; nothing under it ships in a released artifact.
      - name: Refuse a reference to a moved-private document or a machine-local path
        run: |
          set -euo pipefail
          pattern='QUESTIONS\.md|STATUS\.md|SPEC\.md|LICENSING\.md|SHARED-CONVENTIONS\.md|AGENTS\.md|docs/plans|SECURITY-REVIEW|RELEASING|/Users/'
          # This workflow file's own definition of the pattern is exempt - it has to spell out
          # the names it forbids elsewhere.
          if git grep -InE "$pattern" -- ':!internal/**' ':!.github/workflows/ci.yml' > hits.txt; then
            echo "::error::found a reference to a moved-private document or a machine-local path:"
            cat hits.txt
            rm -f hits.txt
            exit 1
          fi
          rm -f hits.txt
          echo "no dangling reference to a moved-private document or a machine path found"
