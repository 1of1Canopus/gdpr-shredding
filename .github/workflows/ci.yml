name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # F2 (fourteenth pass): CONTRIBUTING.md requires every commit in a pull request to carry a DCO
  # "Signed-off-by:" trailer (git commit -s). This is the only enforcement of that requirement -
  # nothing rejects an unsigned commit at merge time otherwise. Runs only on pull_request, where
  # github.event.pull_request.base.sha / .head.sha give an exact commit range; a plain push to
  # main (already reviewed, already merged) is not re-checked. Copied from
  # B-agent-guard/.github/workflows/ci.yml (its G2/G3/G4 hardening kept verbatim: parent count,
  # not subject text, is what exempts a merge commit, and only a trivial back-merge of the base
  # at that - an octopus merge, an evil merge, or a two-parent commit whose second parent is not
  # from the base all fall through to the sign-off requirement).
  #
  # The GRANDFATHER_SHA exemption that used to live here covered the commits pushed to the
  # first pull request before this job existed. It was self-limiting by construction: it
  # exempted a commit only if it WAS c1b4157 or an ancestor of it, and once that pull request
  # merged, c1b4157 became part of main's history, so every commit on every later branch is a
  # DESCENDANT of it and can never match. Removed now that it has merged, per the release
  # hygiene checklist ("any grandfather SHA scoped to one commit and removed before
  # go-public").
  dco:
    name: DCO sign-off
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Verify every commit in this pull request is signed off
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          missing=0
          while IFS= read -r sha; do
            [ -n "$sha" ] || continue
            subject="$(git log -1 --format='%s' "$sha")"
            # a merge commit is exempt because it has two-or-more parents (%P), never because of
            # its subject - a subject is free text the committer chooses and cannot be trusted.
            # Parent count alone is too broad, though: an octopus merge or a two-parent commit
            # whose second parent is not from the base can carry authored content ("evil merge")
            # that exists in no parent, while still being waved through as "a real merge". Exempt
            # a merge only when it is a trivial back-merge of the base: exactly two parents, the
            # second an ancestor of BASE_SHA, and the commit's own tree identical to the tree git
            # itself computes for merging those two parents (git merge-tree, needs git >= 2.38;
            # ubuntu-latest is well past it). An octopus, a two-parent commit whose second parent
            # is not from the base, and any merge carrying an evil-merge delta all fall through to
            # the sign-off requirement.
            parents="$(git log -1 --format='%P' "$sha")"
            set -- $parents
            if [ "$#" -ge 2 ]; then
              exempt=0
              if [ "$#" -eq 2 ] && git merge-base --is-ancestor "$2" "$BASE_SHA" 2>/dev/null; then
                auto=""
                # git merge-tree --write-tree exits non-zero when the merge it computes has a
                # conflict, even though it still writes a tree. Under set -euo pipefail that would
                # kill this step before the sign-off check ever ran; the if guards the
                # substitution so errexit skips it on that path instead: auto stays empty, the
                # exempt check fails, and a conflict-resolution merge (authored content) correctly
                # falls through to the sign-off requirement below, with a visible error.
                if merged="$(git merge-tree --write-tree "$1" "$2" 2>/dev/null)"; then
                  auto="$(printf '%s\n' "$merged" | head -1)"
                fi
                own="$(git rev-parse "$sha^{tree}")"
                [ -n "$auto" ] && [ "$auto" = "$own" ] && exempt=1
              fi
              [ "$exempt" -eq 1 ] && continue
            fi
            if ! git log -1 --format='%B' "$sha" | grep -Eiq '^Signed-off-by: .+ <.+@.+>$'; then
              echo "::error::commit $sha (\"$subject\") has no 'Signed-off-by:' trailer - see CONTRIBUTING.md, git commit -s"
              missing=$((missing + 1))
            fi
          done < <(git rev-list "${BASE_SHA}..${HEAD_SHA}")
          if [ "$missing" -gt 0 ]; then
            echo "::error::$missing commit(s) missing a DCO sign-off"
            exit 1
          fi
          echo "all commits in ${BASE_SHA}..${HEAD_SHA} are signed off"

  build-and-test:
    name: Build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      # ubuntu-latest ships Docker: Testcontainers starts PostgreSQL and Redis for the integration tests.
      - name: Build, test, format check, coverage gate, licence gates, third-party notices
        run: ./mvnw -B clean verify
      # The licence gate has two halves, both inside the build above: an any-of PERMISSION
      # allowlist (license-maven-plugin <includedLicenses>) and an all-of DENIAL pass
      # (tools/check-third-party-licences.sh, from exec-maven-plugin, per module). The denial
      # pass carries a short list of coordinates a human accepted as genuinely dual-licensed.
      # This step is the third question, the only one that cannot be answered per module: is
      # every one of those carve-outs still needed by this tree? A carve-out whose dependency
      # is gone is a pre-approval sitting there waiting for a future dependency to reuse the
      # coordinate. Runs after the full build, when every module's notices file exists.
      - name: Refuse a licence carve-out this tree no longer needs
        run: tools/check-third-party-licences.sh --check-unused
      - name: Upload third-party notices
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: third-party-notices
          path: "**/target/THIRD-PARTY-NOTICES.txt"

  # The reference guard is its own job, not a step inside "Build & test", because the release
  # hygiene checklist requires it as a required status check in its own right - a check that
  # only exists as one step of another job cannot be named in a ruleset, and a failure in it
  # reads as a build failure. The pattern it enforces lives in exactly one place,
  # tools/check-private-references.sh; this job runs its tree half (no JDK, no build needed).
  # The jar half runs in release-dryrun below, where the jars exist. The script's own
  # --self-test (plants one mutation per class and asserts red on each) runs here too, so the
  # guard's guard is exercised on every push, not only when someone remembers.
  reference-guard:
    name: Reference guard
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Self-test the guard (one planted mutation per class, each must go red)
        run: tools/check-private-references.sh --self-test
      - name: Refuse a reference to a moved-private document or a machine-local path
        run: tools/check-private-references.sh --tree

  # N12 (carried over from the reference product, where a probe suite that was only ever run
  # by hand is the mechanical reason a debug-guard defect reached a tagged release): run the
  # probe suite on every push and pull request, unconditionally - no `continue-on-error`, no
  # `if:` that can skip it. The script exits 1 while any probe still reads WEAK, and three of
  # its own probes assert that this very job cannot be disabled by a comment, by `if: false`,
  # or by renaming it.
  cipher-probes:
    name: Cipher probes
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      # ubuntu-latest ships Docker; CIPHER_PROBE_MAVEN=1 runs the probes that shell out to the
      # pinned Maven wrapper.
      - name: Run the security review probe suite
        run: CIPHER_PROBE_MAVEN=1 tools/cipher-probe-release-pipeline.sh
      - name: Run the Dependabot auto-merge probe suite
        run: tools/cipher-probe-dependabot.sh

  # Keyless CVE gate, pull-request half. OSV-Scanner reads the real, transitively resolved
  # dependency graph of every pom in the tree (deps.dev's resolver, not a text match on the
  # poms) and writes a JSON report; the threshold that decides whether this build fails is
  # NOT the scanner's exit code but tools/check-vulnerability-report.py, which both this job
  # and the release use, so the gate before a release cannot be quietly weaker than the gate
  # before a merge.
  #
  # Fail closed on both halves: the scanner exiting anything other than "clean" (0) or
  # "findings" (1) fails the job, and so does an empty or unparseable report. "We could not
  # scan" is not "there is nothing there" - that includes exit 128, "no packages found",
  # which for this tree can only mean the resolution did not happen.
  #
  # Offline behaviour, stated rather than discovered: this job needs the network twice, once
  # to fetch the pinned scanner from its release page and once for deps.dev. Either failing
  # fails the job. There is no offline mode and no cached-database fallback, because a stale
  # database is the failure mode a CVE gate exists to prevent - an advisory published
  # yesterday is exactly the one this check is for.
  #
  # The scanner is installed by tools/install-scanner.sh at a pinned version verified against
  # a checksum recorded in the repository, rather than through the vendor's Action: that
  # Action is a Docker action whose image reference is a mutable tag, so pinning its commit
  # sha would pin the YAML and not the scanner. See the script's header.
  vulnerability-scan:
    name: Vulnerability scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Self-test the severity gate (CVSS arithmetic, report parsing, unrated handling)
        run: tools/check-vulnerability-report.py --self-test
      - name: Install the pinned OSV-Scanner and verify its checksum
        run: tools/install-scanner.sh osv-scanner "${RUNNER_TEMP}/bin"
      # Every pom is named explicitly, and the resolver is pointed at Maven Central rather than
      # at deps.dev. Both were learned by running it: a recursive scan of this tree exits 127
      # ("failed resolution") because deps.dev does not know this repository's own SNAPSHOT
      # modules, nor every AWS SDK artifact the optional S3 store pulls in. With the native
      # resolver those unresolvable coordinates are reported as "local/unscannable" and skipped,
      # and everything a host actually downloads is resolved and scanned.
      - name: Scan the resolved dependency graph
        run: |
          set -uo pipefail
          "${RUNNER_TEMP}/bin/osv-scanner" scan source \
            --data-source=native --maven-registry=https://repo.maven.apache.org/maven2 \
            --all-packages \
            --format json --output-file "${RUNNER_TEMP}/osv.json" \
            -L pom.xml:pom.xml \
            -L pom.xml:gdpr-shredding-core/pom.xml \
            -L pom.xml:gdpr-shredding-spring-boot-starter/pom.xml \
            -L pom.xml:gdpr-shredding-sample/pom.xml
          rc=$?
          # 0: scanned, nothing found. 1: scanned, findings - the severity step decides.
          # Anything else (127 error, 128 no packages found) means the scan did not happen.
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 1 ]; then
            echo "::error::osv-scanner exited $rc: the scan did not complete, so this check cannot say the dependencies are clean"
            exit 1
          fi
      - name: Fail on a known HIGH or CRITICAL vulnerability
        run: |
          tools/check-vulnerability-report.py \
            --format osv --report "${RUNNER_TEMP}/osv.json" --fail-on high
      - name: Upload the vulnerability report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: osv-report
          path: ${{ runner.temp }}/osv.json
          if-no-files-found: warn

  # F3 (fourteenth pass): the release profile (`pom.xml`'s `release` profile) was never exercised
  # by CI - it runs only `clean verify` and `-Psecurity-scan` - so its javadoc break shipped
  # unnoticed for six passes. Runs the documented dry run on every push and pull request.
  #
  # G-1 (fifteenth pass): the step used to run `package` with `-Dgpg.skip=true`, so
  # `maven-gpg-plugin` (bound to `verify`) never ran and no `.asc` was ever produced, even
  # though the step's own name claimed a detached signature was built. There is no Maven
  # Central secret to sign with here (that only exists on a real release, via `GPG_PRIVATE_KEY`
  # / `GPG_PASSPHRASE`), so this job generates its own throwaway key, signs with it, and throws
  # it away with the runner - it proves the signing wiring itself works (phase binding,
  # pinentry mode, `MAVEN_GPG_PASSPHRASE`, one signature per published jar), not that the real
  # key is not compromised.
  release-dryrun:
    name: Release dry run (build, sign with a throwaway key, verify one signature per jar)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Generate an ephemeral GPG key for this run only
        run: |
          set -euo pipefail
          export GNUPGHOME="${RUNNER_TEMP}/gnupg-dryrun"
          mkdir -m 700 "$GNUPGHOME"
          echo "GNUPGHOME=${GNUPGHOME}" >> "$GITHUB_ENV"
          gpg --batch --passphrase '' --quick-generate-key ci-dryrun@example.invalid default default 0
      # No -DskipTests. The jar assertions below (one signature per jar, the sources-jar
      # listing, the reference guard inside every jar) are only worth anything against the jar
      # a release actually produces, and `clean deploy -Prelease` runs the tests. With
      # -DskipTests this job never saw a target/ that the tests had written into, which is
      # exactly how build output (a javadoc plugin tracking file carrying an absolute build
      # path) reached a sources jar unnoticed. The price is one Testcontainers run per push.
      - name: Build sources jar, javadoc jar and sign every artifact (tests run, as a release does)
        env:
          MAVEN_GPG_PASSPHRASE: ""
        run: ./mvnw -B -Prelease verify
      - name: Verify one detached signature per published jar (core, starter; the sample is never published)
        run: |
          set -euo pipefail
          missing=0
          for dir in gdpr-shredding-core gdpr-shredding-spring-boot-starter; do
            for jar in "$dir"/target/*.jar; do
              if [ ! -f "${jar}.asc" ]; then
                echo "::error::no detached signature for ${jar}"
                missing=$((missing + 1))
              fi
            done
          done
          if [ "$missing" -gt 0 ]; then
            echo "::error::${missing} published jar(s) have no .asc signature"
            exit 1
          fi
          echo "every published jar (core, starter) has a detached signature"
      # An allowlist on the sources jar listing, not a denylist of known-bad names: the defect
      # class here is "something in target/ got swept in", and the set of things that could be
      # swept in is open-ended, so the only assertion that holds is the one that names what may
      # be there. Sources (.java), the module's own resources, the embedded licence texts and
      # the jar's own metadata - anything else fails.
      - name: Confirm each sources jar holds sources, resources and the licence texts only
        run: |
          set -euo pipefail
          status=0
          for jar in gdpr-shredding-core/target/*-sources.jar gdpr-shredding-spring-boot-starter/target/*-sources.jar; do
            [ -f "$jar" ] || { echo "::error::no sources jar built for ${jar%%/*}"; status=1; continue; }
            echo "--- $jar"
            unzip -Z1 "$jar"
            while IFS= read -r entry; do
              case "$entry" in
                */)                        continue ;;   # directory entry
                META-INF/MANIFEST.MF)      continue ;;
                META-INF/LICENSE|META-INF/NOTICE) continue ;;
                META-INF/maven/*)          continue ;;
                # The starter's one .txt resource, named exactly and by full path. Not a bare
                # "*.txt": that would re-admit THIRD-PARTY-NOTICES.txt, which is the generated
                # build output this assertion exists to keep out of a sources jar.
                com/housedevinci/shredding/autoconfigure/postgresql-*-reserved-keywords.txt) continue ;;
              esac
              # Path check first: the entry must live under META-INF/ or under the module's
              # own source package root (com/), whatever its extension. This is what refuses
              # target/classes/**, target/surefire-reports/** or any other build-output
              # directory a re-registered resource root could sweep in - an extension
              # allowlist alone does not catch those (RP-3).
              case "$entry" in
                META-INF/*|com/*) : ;;
                *)
                  echo "::error::$jar ships an entry outside META-INF/ and the module's source root (com/): $entry"
                  status=1
                  continue
                  ;;
              esac
              case "$entry" in
                *.java)                    continue ;;
                *.properties|*.yml|*.yaml|*.json|*.sql|*.factories|*.imports) continue ;;
                *)
                  echo "::error::$jar ships an entry that is neither source, module resource nor licence text: $entry"
                  status=1
                  ;;
              esac
            done < <(unzip -Z1 "$jar")
          done
          exit "$status"
      # The tree half of this guard runs in the reference-guard job; this is the jar half.
      # maven-source-plugin and maven-javadoc-plugin copy file contents into the jars verbatim,
      # so a reference the tree scan would have caught is what a reader of the published jar
      # sees too - and `git grep` only ever sees the working tree, never what a plugin put in
      # an archive. The loop covers EVERY jar in each published module's target/, the main jar
      # included, not only sources and javadoc. Same single pattern definition as the tree
      # scan, in tools/check-private-references.sh: there is no second copy to drift.
      - name: Refuse a moved-private document reference or a machine-local path inside a published jar
        run: tools/check-private-references.sh --jars gdpr-shredding-core gdpr-shredding-spring-boot-starter
